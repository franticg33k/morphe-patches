# Sony Creators' App (jp.co.sony.ips.portalapp) - ZV-E10 support fingerprint set.
#
# Mirrors patches/src/main/kotlin/app/franticg33k/patches/creatorsapp/zve10/Fingerprints.kt
# Ported from https://github.com/peiyuanix/zv-e10-creators-app-patcher (MIT), written against 3.5.0
# and re-resolved on 3.6.0. The app is NOT obfuscated, so class + method names are the anchors.
# P6 (hide Import on USB) is intentionally not ported: it needs a resource id (0x7f0a0494 in
# 3.5.0) that moved in 3.6.0.

package: jp.co.sony.ips.portalapp
appName: Creators' App
version: "3.6.0"
pinnedVersions: ["3.5.0", "3.6.0"]
extracted: apks/creatorsapp/tree

