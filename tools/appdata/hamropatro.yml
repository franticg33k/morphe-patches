# Hamro Patro 11.1.2 - fingerprint set.
#
# Mirrors patches/src/main/kotlin/app/franticg33k/patches/hamropatro/ads/Fingerprints.kt
#
# 11.1.2 dropped HamroAdsPlacements (the 10.7.x anchor, which needed three obfuscated parameter
# types re-pinned every build). The new anchor is the ad policy gate's own verdict strings, so
# compatibility is package-name-only (AGENTS.md rule 14).

package: com.hamropatro
appName: Hamro Patro
version: "11.1.2"
pinnedVersions: []
extracted: apks/extracted/hamropatro

fingerprints:
  - name: AdGateFingerprint
    strings:
      - debug_ads_off
      - debug_subscribed
      - debug_format_off
      - ads_disabled
      - rewarded_ad_free
      - ad_free_service
      - no_consent
      - format_gated
      - placement_disabled
    instanceOnly: true
    note: >-
      Resolves to mr/b2.a(Llr/v;)Llr/f; in 11.1.2. lr/g.<clinit> and h10/o's static
      message mapper hold the same strings, hence instanceOnly.
