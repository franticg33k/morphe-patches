# byAir (com.byairapp.android) - fingerprint set.
#
# Mirrors patches/src/main/kotlin/app/franticg33k/patches/byair/{premium,update}/...
# Verified against 2.41.0 (versionCode 224). See docs/byair-premium-bypass.md and
# docs/byair-remove-update-prompt.md.
#
# byAir's own module classes under ru/wearemad/... are NOT R8-obfuscated, so these anchors
# pin definingClass + name freely. Only the internals they call (kotlin.Result, Play Core's
# AppUpdateManager, ...) are renamed, and the Kotlin patches resolve those structurally.
#
# =====================================================================================
# KNOWN PRE-EXISTING FAILURE ON 2.41.0: UpdateSubscriptionUserIdUseCaseFingerprint
# =====================================================================================
# The class ru/wearemad/i_subscriptions/use_case/UpdateSubscriptionUserIdUseCase is gone from
# 2.41.0 entirely (the whole use_case package was reshuffled). The "Enable Online Pro" patch
# (default=false, experimental) still references it, so that patch cannot apply to 2.41.0 and
# fails closed with a fingerprint mismatch. Left failing here on purpose, exactly like the
# JellyWatch entries: a red gate is the honest signal, a guessed re-pin would be worse. This is
# unrelated to "Remove Update Prompt"; fix it by re-anchoring the seam, not by deleting the row.

# --- premium/Fingerprints.kt (2.41.0 note: one entry no longer resolves, see above) ---

package: com.byairapp.android
appName: byAir
version: "2.41.0"
# 2.41.0 is pinned in COMPATIBILITY_BYAIR (targets = listOf(AppTarget("2.41.0"))), so the harness
# cross-checks that the version verified here is one the patch actually offers. Adding a new
# byAir release means adding its AppTarget there *and* listing it here.
pinnedVersions: ["2.41.0"]
extracted: apks/extracted/byair

